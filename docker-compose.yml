version: '3.8'

services:
  # ============================================================================
  # 0. MySQL Database Server
  # ============================================================================
  mysql:
    image: mysql:8.4
    container_name: marketgrid-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password_123}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketgrid-network

  # ============================================================================
  # 1. Service Discovery Registry (Eureka)
  # ============================================================================
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - marketgrid-network

  # ============================================================================
  # 2. Centralized Configuration Server
  # ============================================================================
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=config-server
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - JWT_SECRET=${JWT_SECRET:-bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin@12345}
      - USER_DB_PASSWORD=${USER_DB_PASSWORD:-user_db_password_123}
      - VENDOR_DB_PASSWORD=${VENDOR_DB_PASSWORD:-vendor_db_password_123}
      - PRODUCT_DB_PASSWORD=${PRODUCT_DB_PASSWORD:-product_db_password_123}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD:-order_db_password_123}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - marketgrid-network

  # ============================================================================
  # 3. User & Authentication Microservice
  # ============================================================================
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=user-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - USER_DB_URL=jdbc:mysql://mysql:3306/marketgrid_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      - USER_DB_USERNAME=${USER_DB_USERNAME:-user_service_user}
      - USER_DB_PASSWORD=${USER_DB_PASSWORD:-user_db_password_123}
      - JWT_SECRET=${JWT_SECRET:-bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - marketgrid-network

  # ============================================================================
  # 4. Vendor Management Microservice
  # ============================================================================
  vendor-service:
    build:
      context: .
      dockerfile: vendor-service/Dockerfile
    container_name: vendor-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=vendor-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - VENDOR_DB_URL=jdbc:mysql://mysql:3306/marketgrid_vendor_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      - VENDOR_DB_USERNAME=${VENDOR_DB_USERNAME:-vendor_service_user}
      - VENDOR_DB_PASSWORD=${VENDOR_DB_PASSWORD:-vendor_db_password_123}
      - JWT_SECRET=${JWT_SECRET:-bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - marketgrid-network

  # ============================================================================
  # 5. Product Catalog & Inventory Microservice (Instance 1)
  # ============================================================================
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=product-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - PRODUCT_DB_URL=jdbc:mysql://mysql:3306/marketgrid_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      - PRODUCT_DB_USERNAME=${PRODUCT_DB_USERNAME:-product_service_user}
      - PRODUCT_DB_PASSWORD=${PRODUCT_DB_PASSWORD:-product_db_password_123}
      - JWT_SECRET=${JWT_SECRET:-bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - marketgrid-network

  # ============================================================================
  # 5b. Product Catalog & Inventory Microservice (Instance 2)
  # ============================================================================
  product-service-2:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service-2
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=product-service-2
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - PRODUCT_DB_URL=jdbc:mysql://mysql:3306/marketgrid_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      - PRODUCT_DB_USERNAME=${PRODUCT_DB_USERNAME:-product_service_user}
      - PRODUCT_DB_PASSWORD=${PRODUCT_DB_PASSWORD:-product_db_password_123}
      - JWT_SECRET=${JWT_SECRET:-bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - marketgrid-network

  # ============================================================================
  # 6. Cart & Order Processing Microservice
  # ============================================================================
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=order-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - ORDER_DB_URL=jdbc:mysql://mysql:3306/marketgrid_order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      - ORDER_DB_USERNAME=${ORDER_DB_USERNAME:-order_service_user}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD:-order_db_password_123}
      - JWT_SECRET=${JWT_SECRET:-bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - marketgrid-network

  # ============================================================================
  # 7. Edge API Gateway & Swagger Aggregator
  # ============================================================================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - JWT_SECRET=${JWT_SECRET:-bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      vendor-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || true"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - marketgrid-network

# ==============================================================================
# Shared Bridge Network for Inter-Container Communication
# ==============================================================================
networks:
  marketgrid-network:
    driver: bridge
    name: marketgrid-network

# ==============================================================================
# Persistent Named Volume for MySQL 8.4 Data
# ==============================================================================
volumes:
  mysql-data:
