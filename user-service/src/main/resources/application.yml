server:
  port: 8081

spring:
  application:
    name: user-service

  # Pull additional config from config-server (optional — starts even if config-server is down)
  config:
    import: optional:configserver:http://localhost:8888

  # H2 in-memory database
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true          # access at /h2-console
      path: /h2-console

# Eureka registration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# -------------------------------------------------------------------
# JWT configuration
# IMPORTANT: This secret MUST be the same across every service that
# needs to validate tokens (api-gateway, vendor-service, etc.).
# Use a Base64-encoded string of at least 256 bits (32 bytes).
# Replace this placeholder with a proper secret in production!
# -------------------------------------------------------------------
jwt:
  secret: bWFya2V0Z3JpZC1jb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==
  expiration-ms: 86400000    # 24 hours
