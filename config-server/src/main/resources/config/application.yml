# =============================================================
# Global Shared Configuration for all MarketGrid Microservices
# =============================================================

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${spring.application.name}
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
