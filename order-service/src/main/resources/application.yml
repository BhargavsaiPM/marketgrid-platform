server:
  port: 8084

spring:
  application:
    name: order-service
  config:
    import: configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true

service:
  account:
    username: admin
    password: Admin@12345

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
